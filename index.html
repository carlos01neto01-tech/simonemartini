<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Simone Martini - Pré-candidata a deputada estadual. Sarandi merece voltar a sonhar." />
  <title>Simone Martini | Pré-candidata a Deputada Estadual</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --purple: #a800ff;
      --purple-dark: #3d0c5c;
      --black: #050505;
      --white: #ffffff;
      --page-bg: #f7f1fb;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      font-family: "Inter", Arial, sans-serif;
      background: var(--page-bg);
      color: var(--black);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      align-items: center;
      isolation: isolate;
      background: var(--page-bg);
    }

    .hero__media {
      position: absolute;
      inset: 0;
      z-index: -3;
    }

    .hero__media img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.82) 0%,
          rgba(255, 255, 255, 0.66) 24%,
          rgba(255, 255, 255, 0.28) 43%,
          rgba(255, 255, 255, 0.00) 66%
        );
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.06) 0%,
          rgba(255, 255, 255, 0.00) 46%,
          rgba(0, 0, 0, 0.14) 100%
        );
    }

    .hero__content {
      width: min(100%, 1280px);
      margin: 0 auto;
      padding-left: clamp(52px, 7.2vw, 96px);
      padding-right: 32px;
      transform: translateY(-34px);
    }

    .hero__eyebrow {
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #000000;
    }

    .hero__title {
      max-width: 660px;
      margin-bottom: 22px;
      font-size: 80px;
      line-height: 0.92;
      font-weight: 600;
      letter-spacing: -6px;
      color: #000000;
    }

    .hero__title span {
      color: var(--purple);
    }

    .hero__subtitle {
      max-width: 575px;
      margin-bottom: 25px;
      font-size: 25px;
      line-height: 1.04;
      font-weight: 300;
      letter-spacing: -1.6px;
      color: #000000;
    }

    .hero__actions {
      width: 515px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      min-height: 80px;
      padding: 14px 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 35px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -2px;
      transition: transform 0.25s ease, filter 0.25s ease, box-shadow 0.25s ease;
      will-change: transform;
    }

    .btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.04);
    }

    .btn--primary {
      color: #ffffff;
      background: linear-gradient(135deg, #9900ff 0%, #bd00ff 54%, #9500ff 100%);
      box-shadow: 0 18px 45px rgba(160, 0, 255, 0.28);
    }

    .btn--secondary {
      color: var(--purple-dark);
      background: rgba(255, 255, 255, 0.43);
      border: 1.8px solid rgba(255, 255, 255, 0.96);
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .reveal {
      opacity: 0;
      filter: blur(18px);
      transform: translateY(34px);
      animation: cascadeReveal 0.9s cubic-bezier(.2,.75,.22,1) forwards;
    }

    .reveal-1 { animation-delay: 0.10s; }
    .reveal-2 { animation-delay: 0.26s; }
    .reveal-3 { animation-delay: 0.42s; }
    .reveal-4 { animation-delay: 0.58s; }

    @keyframes cascadeReveal {
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .hero {
        min-height: 100vh;
        min-height: 100svh;
        align-items: flex-end;
      }

      .hero__media img {
        object-position: top center;
      }

      .hero::before {
        background:
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.00) 0%,
            rgba(0, 0, 0, 0.01) 34%,
            rgba(247, 241, 251, 0.28) 49%,
            rgba(247, 241, 251, 0.86) 62%,
            rgba(247, 241, 251, 0.98) 77%,
            #f7f1fb 100%
          );
      }

      .hero::after {
        background:
          radial-gradient(
            circle at 50% 58%,
            rgba(255, 255, 255, 0.66) 0%,
            rgba(255, 255, 255, 0.28) 27%,
            rgba(255, 255, 255, 0.00) 50%
          );
      }

      .hero__content {
        width: 100%;
        padding: 0 26px 54px;
        transform: none;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hero__eyebrow {
        margin-bottom: 18px;
        font-size: 7px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: 5px;
      }

      .hero__title {
        max-width: 360px;
        margin-bottom: 15px;
        font-size: 40px;
        line-height: 0.95;
        font-weight: 600;
        letter-spacing: -3.2px;
      }

      .hero__subtitle {
        max-width: 330px;
        margin-bottom: 24px;
        font-size: 15px;
        line-height: 1.07;
        font-weight: 300;
        letter-spacing: -0.9px;
      }

      .hero__actions {
        width: 100%;
        gap: 12px;
      }

      .btn {
        min-height: 70px;
        padding: 14px 22px;
        font-size: 25px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -1.5px;
      }

      .btn--secondary {
        color: var(--purple-dark);
        border: 2px solid var(--purple-dark);
        background: rgba(255, 255, 255, 0.42);
        box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.35);
      }
    }

    @media (max-width: 390px) {
      .hero__content {
        padding-left: 22px;
        padding-right: 22px;
        padding-bottom: 44px;
      }

      .hero__title {
        font-size: 38px;
      }

      .btn {
        min-height: 66px;
        font-size: 23px;
      }
    }

    @media (min-width: 1500px) {
      .hero__content {
        width: min(100%, 1440px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .reveal {
        opacity: 1;
        filter: none;
        transform: none;
        animation: none;
      }

      .btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" id="inicio" aria-label="Primeira seção Simone Martini">
      <picture class="hero__media" aria-hidden="true">
        <source media="(max-width: 900px)" srcset="assets/img/simone-mobile.webp" />
        <img src="assets/img/simone-desktop.webp" alt="" loading="eager" decoding="async" />
      </picture>

      <div class="hero__content">
        <p class="hero__eyebrow reveal reveal-1">Pré-candidata a deputada estadual</p>

        <h1 class="hero__title reveal reveal-2">
          <span>Sarandi</span> merece<br />
          voltar a sonhar!
        </h1>

        <p class="hero__subtitle reveal reveal-3">
          Simone Martini construiu sua trajetória entre o cuidado com pessoas, experiência pública e compromisso verdadeiro com Sarandi e o Paraná.
        </p>

        <div class="hero__actions reveal reveal-4">
          <a class="btn btn--primary" href="#propostas">Conheça minhas propostas</a>
          <a class="btn btn--secondary" href="#jornada">Faça parte dessa jornada</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
